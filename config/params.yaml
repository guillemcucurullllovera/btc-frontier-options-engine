# Asymmetrica BTC engine — single source of truth (mandate parameters)
#
# LOCKED POLICY (ratified Aug-2026, DECISIONS_LOG D-A/D-B/D-C):
#   +6% laddered COVERED CALL, INCOME OVERLAY (not acquisition), 40% coverage
#   (12,000 covered / 18,000 uncapped), strikes 6/10/14/18% OTM, QUARTERLY cadence,
#   IV-timed entry (harvest-when-rich). Tier-B financed protective put = OPTIONAL
#   add-on only, never the lead. Advisory: the client approves every trade.
# This replaces the stale monthly 15-20% collar. Provenance: BUSINESS_REQUIREMENT.
btc_quantity: 30000
reference_spot_usd: 65000          # working value; REFRESH via live feed before the meeting
seller_discount_pct: 2.5
target_option_yield_pct: 2.5
combined_target_discount_pct: 5.0
execution_fee_pct: 0.5

# ── Locked mandate ladder (the +6% floor) ────────────────────────────────────
coverage_fraction_pct: 40.0                     # 40% = 12,000 BTC covered (4 x 3,000)
ladder_strikes_pct_above_spot: [6.0, 10.0, 14.0, 18.0]   # asymmetric +6/+10/+14/+18% OTM
cadence: quarterly                              # quarterly IV-timed entry (was monthly collar)
iv_timed_entry: true                            # write when IV is rich (harvest-when-rich)
sell_when_dvol_above: 55.0                       # ~median DVOL (55.7%); IV-timing trigger

# ── Realised-delta span of the +6% ladder (informational; strike-selected, not
#    delta-selected). Nearest +6% leg delta ~0.24, farthest +18% leg ~0.03. ──
call_delta_target: [0.03, 0.25]
dte_target_days: [28, 45]                       # ~1-month traded tenor (the priced/gated tenor)
strike_target_pct_above_spot: [6.0, 18.0]       # ladder bracket (nearest floor .. far bookend)
target_monthly_premium_pct: 3.0                 # legacy target; observed income is IV-timed CURVE
iv_working_band_pct: [40, 50]                    # DVOL working band; live via vol/dvol_feed.py
risk_free_rate_pct: 4.0
tranche_btc: [250, 1000]                         # execution clip range (acquisition-side)
expiry_ladder_dte: [31, 38, 45, 52]              # quarterly ladder tranche DTEs (near..far)
