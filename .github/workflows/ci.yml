name: BTC Engine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pyyaml scipy numpy requests pytest hypothesis ruff mypy
      - name: pytest
        run: python -m pytest -q

  reprice-gate:
    name: per-tenor reprice gate + client-number regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pyyaml scipy numpy requests pytest arch statsmodels
      # REAL call site: bind the client-facing accuracy claim to the tenor we trade.
      # The per-tenor gate hard-asserts the traded ~1-month bucket (~97.6%, honest —
      # NOT a tenor-aggregated average that hides it) and the +6% income / ledger /
      # deflated-Sharpe / data-integrity anchors, so a silent drift fails CI.
      - name: per-tenor reprice gate (fixture diagnostic)
        run: python -m vol.reprice_gate
      - name: client-number regression suite
        run: >
          python -m pytest -q
          tests/test_client_numbers_regression.py
          tests/test_reprice_gate_per_tenor.py

  typecheck:
    name: mypy (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pyyaml scipy numpy requests mypy types-requests types-PyYAML
      - name: mypy
        run: python -m mypy pricing/ execution/ config/ engine/ tests/ vol/ scripts/

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: ruff check
        run: python -m ruff check pricing/ execution/ config/ engine/ tests/ vol/ scripts/

  anonymisation:
    name: confidentiality scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run anonymisation scan
        run: python scripts/anonymisation_scan.py
