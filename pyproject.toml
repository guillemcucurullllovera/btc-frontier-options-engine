[project]
name = "btc-engine"
version = "0.1.0"
description = "Asymmetrica BTC 30k options-overlay comparison engine"
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Asymmetrica" }]
# U21 (SR 11-7): pin runtime + validation deps so the checks are reproducible and
# never silently skipped. QuantLib (external pricing anchor) + hypothesis
# (property fuzzing) are validation deps in the dev group.
dependencies = [
    "numpy>=2.5.1",
    "scipy>=1.18.0",
    "requests>=2.34.2",
    "pydantic>=2.13.4",
    "PyYAML>=6.0.3",
    "arch>=8.0.0",
    "statsmodels>=0.14.6",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-q",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "network: tests requiring live network access (skip by default, use --run-network to enable)",
    "xfail: expected failure pending resolution of a frozen business decision",
]

[tool.mypy]
files = ["config", "engine", "execution", "pricing", "research", "risk", "scripts", "strategy", "tests", "vol"]
exclude = "^(private_reference_library|reference)/"
strict = true
python_version = "3.12"
explicit_package_bases = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_no_return = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_return_any = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "deprecated",
]

[[tool.mypy.overrides]]
module = "QuantLib"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pandas"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    ".mypy_cache",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
    "private_reference_library",
    "reference",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (acceptable for Path default)
    "B017",  # pytest.raises(Exception) is acceptable for validation-error testing
    "B011",  # assert False in skipped tests is explicit intent
]
# Allow the intended math notation in docstrings/comments (Greek letters and math
# operators) so RUF001/002/003 do not flag it as "ambiguous unicode". These are the
# real symbols the pricing math uses (e.g. σ vol, × product, · dot) — NOT typos to be
# mangled into ASCII look-alikes. Keep this list tight so genuine confusables still fire.
allowed-confusables = ["σ", "×", "·"]

[tool.ruff.lint.isort]
known-first-party = ["pricing", "vol", "execution", "config", "engine", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[dependency-groups]
dev = [
    "scipy-stubs>=1.18.0.1",
    "types-pyyaml>=6.0.12.20260724",
    # U21 / U8: validation deps — the external pricing anchor (QuantLib) and
    # property-based fuzzing (hypothesis) must always be present so the checks run.
    "QuantLib>=1.43",
    "hypothesis>=6.161.6",
]
