[project]
name = "btc-engine"
version = "0.1.0"
description = "Asymmetrica BTC 30k options-overlay comparison engine"
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Asymmetrica" }]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-q",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "network: tests requiring live network access (skip by default, use --run-network to enable)",
    "xfail: expected failure pending resolution of a frozen business decision",
]

[tool.mypy]
files = ["config", "engine", "execution", "pricing", "scripts", "tests", "vol"]
exclude = "^(private_reference_library|reference)/"
strict = true
python_version = "3.12"
explicit_package_bases = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_no_return = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_return_any = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    ".mypy_cache",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
    "private_reference_library",
    "reference",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (acceptable for Path default)
    "B017",  # pytest.raises(Exception) is acceptable for validation-error testing
    "B011",  # assert False in skipped tests is explicit intent
]

[tool.ruff.lint.isort]
known-first-party = ["pricing", "vol", "execution", "config", "engine", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[dependency-groups]
dev = [
    "scipy-stubs>=1.18.0.1",
    "types-pyyaml>=6.0.12.20260724",
]
